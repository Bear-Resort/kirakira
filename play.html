<body class="play">
<header class="bar">
  <a class="brand" href="./" data-track="play-brand">✦ KIRA·KIRA <small data-i18n="brand_sub">雾里的悄悄话</small></a>
  <button class="lang" id="lang" type="button" aria-label="Switch to English">EN</button>
</header>

<main class="play-main" id="main">
  <h1 id="title" tabindex="-1">有人给你留了一句话</h1>
  <p class="hint" id="hint">用手指擦开雾气看看</p>

  <div class="stage-wrap">
  <div class="stage" id="stage" role="img" aria-label="雾里藏着一句话">
    <canvas id="card" aria-hidden="true"></canvas>
    <canvas id="fog" aria-hidden="true"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="finger" id="finger" aria-hidden="true"></div>
  </div>
  </div>

  <div class="meter" id="meter">
    <div class="meter-track" aria-hidden="true"><div class="meter-fill" id="meterFill"></div></div>
    <p class="meter-label" id="meterLabel" aria-hidden="true">已擦开 0%</p>
    <p class="sr-only" id="meterLive" aria-live="polite"></p>
  </div>
  <button class="btn btn-quiet" id="justShow" type="button" data-i18n="just_show">直接看</button>
</main>

<section class="bad" id="bad" hidden>
  <h1 data-i18n="bad_link_title">这个链接好像不完整</h1>
  <p data-i18n="bad_link_body">可能复制的时候少了一截。可以请朋友重新发一次，或者自己做一张。</p>
  <div class="actions">
    <a class="btn btn-primary" href="make.html" data-i18n="make_own" data-track="bad-make-own">做一张我的</a>
    <a class="btn" href="play.html" data-i18n="see_example" data-track="bad-example">看看示例</a>
  </div>
</section>

<section class="sheet" id="done" role="dialog" aria-labelledby="doneTitle" hidden>
  <h2 id="doneTitle" tabindex="-1" data-i18n="done_title">看到了 ✦</h2>
  <p id="doneTime"></p>
  <p id="doneCount" hidden></p>
  <div class="actions">
    <a class="btn btn-primary" id="makeOwn" href="make.html" data-i18n="make_own" data-track="play-make-own">做一张我的</a>
    <button class="btn" id="again" type="button" data-i18n="play_again">再玩一次</button>
    <button class="btn btn-quiet" id="save" type="button" data-i18n="save_pic">保存图片</button>
  </div>
</section>

<div class="overlay" id="saveBox" role="dialog" aria-modal="true" aria-labelledby="saveTitle" hidden>
  <div class="overlay-card">
    <button class="close-x" id="saveClose" type="button" aria-label="关闭">×</button>
    <h2 id="saveTitle" tabindex="-1" data-i18n="save_pic">保存图片</h2>
    <img id="saveImg" alt="">
    <p class="hint" id="saveHint"></p>
    <div class="actions"><a class="btn btn-primary" id="saveDownload" download="kirakira-note.png" href="#" data-i18n="download" data-track="play-download">下载图片</a></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
